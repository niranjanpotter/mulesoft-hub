<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="parallel-title parallel-desc">
  <title id="parallel-title">Mule 4 Parallel Processing Architecture | Scatter-Gather &amp; Parallel For Each</title>
  <desc id="parallel-desc">Comprehensive visual architecture diagram of Mule 4 parallel processing showing Scatter-Gather concurrent routes, Parallel For Each thread throttling, non-blocking reactive thread handoffs, and composite aggregation.</desc>
  
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="par-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071321"/>
      <stop offset="55%" stop-color="#0B2033"/>
      <stop offset="100%" stop-color="#124052"/>
    </linearGradient>
    <radialGradient id="par-glow-left" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#845EC2" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#071321" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="par-glow-right" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#071321" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="par-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#53CADD" stroke-opacity="0.06"/>
    </pattern>

    <!-- Shading Gradients -->
    <linearGradient id="card-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#112233" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0B1622" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="sg-box-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#845EC2" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3E63DD" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="pfe-box-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.06"/>
    </linearGradient>

    <!-- Accent Lines -->
    <linearGradient id="cyan-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="purple-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D65DB1" stop-opacity="0"/>
      <stop offset="50%" stop-color="#D65DB1" stop-opacity="1"/>
      <stop offset="100%" stop-color="#D65DB1" stop-opacity="0"/>
    </linearGradient>

    <!-- Flow Particle Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .par-title { font-family: 'Plus Jakarta Sans', Georgia, sans-serif; font-weight: 700; }
    .par-mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace; }
    .par-sans { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    
    /* Flowing Packet Animations */
    .pkt-flow { stroke-dasharray: 6 94; animation: flow-anim 4.5s linear infinite; }
    .pkt-flow-2 { stroke-dasharray: 6 94; animation: flow-anim 4.5s linear infinite; animation-delay: -1.5s; }
    .pkt-flow-3 { stroke-dasharray: 6 94; animation: flow-anim 4.5s linear infinite; animation-delay: -3s; }
    .pkt-fast { stroke-dasharray: 8 92; animation: flow-anim 3s linear infinite; }
    
    @keyframes flow-anim {
      from { stroke-dashoffset: 100; }
      to { stroke-dashoffset: 0; }
    }
    
    .pulse-glow { animation: pulse-anim 6s ease-in-out infinite; }
    @keyframes pulse-anim {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.7; }
    }

    @media (prefers-reduced-motion: reduce) {
      .pkt-flow, .pkt-flow-2, .pkt-flow-3, .pkt-fast, .pulse-glow { animation: none; stroke-dashoffset: 0; }
    }
  </style>

  <!-- Frame Background -->
  <rect width="1200" height="640" rx="24" fill="url(#par-bg)"/>
  <rect width="1200" height="640" rx="24" fill="url(#par-grid)"/>
  <ellipse class="pulse-glow" cx="240" cy="220" rx="280" ry="240" fill="url(#par-glow-left)"/>
  <ellipse class="pulse-glow" cx="960" cy="420" rx="300" ry="260" fill="url(#par-glow-right)"/>
  <rect x="1" y="1" width="1198" height="638" rx="23" fill="none" stroke="#53CADD" stroke-opacity="0.25"/>

  <!-- ==================== HEADER BAR ==================== -->
  <g class="par-sans" transform="translate(48, 38)">
    <rect width="250" height="28" rx="14" fill="#124052" stroke="#53CADD" stroke-opacity="0.35"/>
    <circle cx="16" cy="14" r="5" fill="#00F2FE"/>
    <text x="30" y="18" fill="#A6EAF4" font-size="11" font-weight="700" letter-spacing="1.5">PARALLEL PROCESSING ENGINE</text>
    
    <text x="0" y="58" fill="#F0F9FF" class="par-title" font-size="26">Mule 4 High-Concurrency Architecture</text>
    <text x="0" y="80" fill="#94A3B8" font-size="13">Non-Blocking Project Reactor Threads · Scatter-Gather Router · Parallel For Each Scope · Zero Thread Starvation</text>
  </g>

  <!-- ==================== SECTION 1: SCATTER-GATHER ROUTER ==================== -->
  <g transform="translate(48, 140)">
    <!-- Container Box -->
    <rect width="530" height="455" rx="16" fill="url(#sg-box-grad)" stroke="#845EC2" stroke-width="1.2" stroke-dasharray="6,4"/>
    <path d="M20 0H510" stroke="url(#purple-accent)" stroke-width="2"/>

    <!-- Section Badge -->
    <rect x="20" y="16" width="190" height="24" rx="6" fill="#845EC2" fill-opacity="0.2" stroke="#845EC2" stroke-opacity="0.4"/>
    <text x="30" y="32" fill="#E0A4E8" class="par-sans" font-size="11" font-weight="700" letter-spacing="1">PATTERN 1: SCATTER-GATHER</text>
    <text x="220" y="32" fill="#94A3B8" class="par-mono" font-size="10">timeout="3000ms" | maxConcurrency="3"</text>

    <!-- Inbound Event Node -->
    <g transform="translate(24, 60)">
      <rect width="140" height="64" rx="8" fill="url(#card-grad)" stroke="#00A1E0" stroke-width="1.2"/>
      <text x="14" y="24" fill="#00F2FE" class="par-mono" font-size="10" font-weight="700">INBOUND EVENT</text>
      <text x="14" y="42" fill="#FFFFFF" class="par-sans" font-size="12" font-weight="700">OrderRequest</text>
      <text x="14" y="55" fill="#94A3B8" class="par-mono" font-size="9">vars.txId = "TX-992"</text>
    </g>

    <!-- Event Cloner Hub -->
    <g transform="translate(195, 76)">
      <circle cx="16" cy="16" r="16" fill="#845EC2" fill-opacity="0.3" stroke="#D65DB1" stroke-width="1.5"/>
      <path d="M11 16H21M16 11V21" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
      <text x="16" y="44" fill="#D65DB1" class="par-sans" font-size="9" font-weight="700" text-anchor="middle">EVENT CLONE</text>
    </g>

    <!-- Connecting Trunk -->
    <path d="M164 92H195" stroke="#00F2FE" stroke-width="1.5"/>

    <!-- Parallel Branch Lines -->
    <path d="M227 92 H250 V82 H270" fill="none" stroke="#D65DB1" stroke-width="1.5"/>
    <path d="M227 92 H270" fill="none" stroke="#D65DB1" stroke-width="1.5"/>
    <path d="M227 92 H250 V202 H270" fill="none" stroke="#D65DB1" stroke-width="1.5"/>

    <!-- Animated Packets on SG Branches -->
    <path class="pkt-flow" pathLength="100" d="M227 92 H250 V82 H270" fill="none" stroke="#00F2FE" stroke-width="2.5" filter="url(#glow-cyan)"/>
    <path class="pkt-flow-2" pathLength="100" d="M227 92 H270" fill="none" stroke="#00F2FE" stroke-width="2.5" filter="url(#glow-cyan)"/>
    <path class="pkt-flow-3" pathLength="100" d="M227 92 H250 V202 H270" fill="none" stroke="#00F2FE" stroke-width="2.5" filter="url(#glow-cyan)"/>

    <!-- Route 0: SAP S/4HANA -->
    <g transform="translate(270, 52)">
      <rect width="235" height="56" rx="8" fill="url(#card-grad)" stroke="#00A1E0" stroke-width="1"/>
      <circle cx="14" cy="18" r="5" fill="#00A1E0"/>
      <text x="26" y="22" fill="#FFFFFF" class="par-sans" font-size="11" font-weight="700">Route [0]: SAP S/4HANA ERP</text>
      <text x="26" y="38" fill="#94A3B8" class="par-mono" font-size="9">BAPI_SALESORDER_CREATE</text>
      <rect x="175" y="10" width="50" height="18" rx="4" fill="#00A1E0" fill-opacity="0.15"/>
      <text x="200" y="22" fill="#00F2FE" class="par-mono" font-size="9" text-anchor="middle">⏱️ 240ms</text>
    </g>

    <!-- Route 1: Salesforce CRM -->
    <g transform="translate(270, 118)">
      <rect width="235" height="56" rx="8" fill="url(#card-grad)" stroke="#F59E0B" stroke-width="1"/>
      <circle cx="14" cy="18" r="5" fill="#F59E0B"/>
      <text x="26" y="22" fill="#FFFFFF" class="par-sans" font-size="11" font-weight="700">Route [1]: Salesforce CRM</text>
      <text x="26" y="38" fill="#94A3B8" class="par-mono" font-size="9">Upsert Account By ExternalID</text>
      <rect x="175" y="10" width="50" height="18" rx="4" fill="#F59E0B" fill-opacity="0.15"/>
      <text x="200" y="22" fill="#FBBF24" class="par-mono" font-size="9" text-anchor="middle">⏱️ 160ms</text>
    </g>

    <!-- Route 2: AWS DynamoDB -->
    <g transform="translate(270, 184)">
      <rect width="235" height="56" rx="8" fill="url(#card-grad)" stroke="#10B981" stroke-width="1"/>
      <circle cx="14" cy="18" r="5" fill="#10B981"/>
      <text x="26" y="22" fill="#FFFFFF" class="par-sans" font-size="11" font-weight="700">Route [2]: AWS DynamoDB</text>
      <text x="26" y="38" fill="#94A3B8" class="par-mono" font-size="9">PutItem (TTL Audit Record)</text>
      <rect x="175" y="10" width="50" height="18" rx="4" fill="#10B981" fill-opacity="0.15"/>
      <text x="200" y="22" fill="#34D399" class="par-mono" font-size="9" text-anchor="middle">⏱️ 45ms</text>
    </g>

    <!-- Aggregation Barrier Box -->
    <g transform="translate(24, 260)">
      <rect width="481" height="88" rx="10" fill="#0E1B2A" stroke="#10B981" stroke-width="1.2"/>
      <path d="M12 0H469" stroke="#10B981" stroke-width="1.5" opacity="0.6"/>
      <text x="16" y="24" fill="#10B981" class="par-sans" font-size="11" font-weight="700">BARRIER AGGREGATION RESULT (COMPOSITE MAP)</text>
      <text x="16" y="44" fill="#FFFFFF" class="par-mono" font-size="10">payload["0"].payload  ➔  SAP Order Confirmation #{9921}</text>
      <text x="16" y="60" fill="#FFFFFF" class="par-mono" font-size="10">payload["1"].payload  ➔  Salesforce Account Updated (200)</text>
      <text x="16" y="76" fill="#FFFFFF" class="par-mono" font-size="10">payload["2"].payload  ➔  DynamoDB Audit Stored (HTTP 200)</text>
    </g>

    <!-- Execution Metric Box -->
    <g transform="translate(24, 362)">
      <rect width="481" height="74" rx="8" fill="#0A141F" stroke="rgba(255,255,255,0.08)"/>
      <text x="16" y="24" fill="#A6EAF4" class="par-sans" font-size="11" font-weight="700">EXECUTION TIME BENEFIT</text>
      <text x="16" y="44" fill="#94A3B8" class="par-sans" font-size="11">Sequential: 240ms + 160ms + 45ms = <tspan fill="#EF4444" font-weight="700">445ms</tspan></text>
      <text x="16" y="62" fill="#F0F9FF" class="par-sans" font-size="12" font-weight="700">Parallel Scatter-Gather: MAX(240, 160, 45) = <tspan fill="#10B981" font-weight="700">240ms (46% FASTER)</tspan></text>
    </g>
  </g>

  <!-- ==================== SECTION 2: PARALLEL FOR EACH ==================== -->
  <g transform="translate(622, 140)">
    <!-- Container Box -->
    <rect width="530" height="455" rx="16" fill="url(#pfe-box-grad)" stroke="#00F2FE" stroke-width="1.2" stroke-dasharray="6,4"/>
    <path d="M20 0H510" stroke="url(#cyan-accent)" stroke-width="2"/>

    <!-- Section Badge -->
    <rect x="20" y="16" width="210" height="24" rx="6" fill="#00F2FE" fill-opacity="0.15" stroke="#00F2FE" stroke-opacity="0.4"/>
    <text x="30" y="32" fill="#53CADD" class="par-sans" font-size="11" font-weight="700" letter-spacing="1">PATTERN 2: PARALLEL FOR EACH</text>
    <text x="240" y="32" fill="#94A3B8" class="par-mono" font-size="10">collection="#[payload]" | maxConcurrency="4"</text>

    <!-- Inbound Array Node -->
    <g transform="translate(24, 60)">
      <rect width="140" height="64" rx="8" fill="url(#card-grad)" stroke="#00F2FE" stroke-width="1.2"/>
      <text x="14" y="24" fill="#00F2FE" class="par-mono" font-size="10" font-weight="700">INPUT ARRAY</text>
      <text x="14" y="42" fill="#FFFFFF" class="par-sans" font-size="12" font-weight="700">[Item_0, Item_1, ...]</text>
      <text x="14" y="55" fill="#94A3B8" class="par-mono" font-size="9">Total Size: 1,000 items</text>
    </g>

    <!-- Concurrency Throttle Pool Node -->
    <g transform="translate(195, 60)">
      <rect width="105" height="64" rx="8" fill="#124052" stroke="#53CADD" stroke-width="1"/>
      <text x="52" y="24" fill="#A6EAF4" class="par-mono" font-size="9" font-weight="700" text-anchor="middle">THREAD POOL</text>
      <text x="52" y="42" fill="#00F2FE" class="par-title" font-size="16" text-anchor="middle">max=4</text>
      <text x="52" y="56" fill="#94A3B8" class="par-mono" font-size="8" text-anchor="middle">NON-BLOCKING</text>
    </g>

    <!-- Connecting Trunk -->
    <path d="M164 92H195" stroke="#00F2FE" stroke-width="1.5"/>
    <path d="M300 92H330" stroke="#00F2FE" stroke-width="1.5"/>

    <!-- Concurrent Processing Lanes -->
    <g transform="translate(330, 48)">
      <!-- Lane 1 -->
      <g transform="translate(0, 0)">
        <rect width="175" height="34" rx="6" fill="url(#card-grad)" stroke="#53CADD" stroke-opacity="0.4"/>
        <text x="10" y="21" fill="#FFFFFF" class="par-mono" font-size="9">Thread-1 ➔ Item[0..249]</text>
        <circle cx="160" cy="17" r="4" fill="#10B981"/>
      </g>
      <!-- Lane 2 -->
      <g transform="translate(0, 42)">
        <rect width="175" height="34" rx="6" fill="url(#card-grad)" stroke="#53CADD" stroke-opacity="0.4"/>
        <text x="10" y="21" fill="#FFFFFF" class="par-mono" font-size="9">Thread-2 ➔ Item[250..499]</text>
        <circle cx="160" cy="17" r="4" fill="#10B981"/>
      </g>
      <!-- Lane 3 -->
      <g transform="translate(0, 84)">
        <rect width="175" height="34" rx="6" fill="url(#card-grad)" stroke="#53CADD" stroke-opacity="0.4"/>
        <text x="10" y="21" fill="#FFFFFF" class="par-mono" font-size="9">Thread-3 ➔ Item[500..749]</text>
        <circle cx="160" cy="17" r="4" fill="#10B981"/>
      </g>
      <!-- Lane 4 -->
      <g transform="translate(0, 126)">
        <rect width="175" height="34" rx="6" fill="url(#card-grad)" stroke="#53CADD" stroke-opacity="0.4"/>
        <text x="10" y="21" fill="#FFFFFF" class="par-mono" font-size="9">Thread-4 ➔ Item[750..999]</text>
        <circle cx="160" cy="17" r="4" fill="#10B981"/>
      </g>
    </g>

    <!-- Animated Packets on Lanes -->
    <path class="pkt-fast" pathLength="100" d="M300 92 L330 65" fill="none" stroke="#00F2FE" stroke-width="2" filter="url(#glow-cyan)"/>
    <path class="pkt-fast" pathLength="100" d="M300 92 L330 107" fill="none" stroke="#00F2FE" stroke-width="2" filter="url(#glow-cyan)"/>
    <path class="pkt-fast" pathLength="100" d="M300 92 L330 149" fill="none" stroke="#00F2FE" stroke-width="2" filter="url(#glow-cyan)"/>
    <path class="pkt-fast" pathLength="100" d="M300 92 L330 191" fill="none" stroke="#00F2FE" stroke-width="2" filter="url(#glow-cyan)"/>

    <!-- Order Preservation Guarantee -->
    <g transform="translate(24, 235)">
      <rect width="481" height="85" rx="10" fill="#0E1B2A" stroke="#00F2FE" stroke-width="1.2"/>
      <text x="16" y="24" fill="#00F2FE" class="par-sans" font-size="11" font-weight="700">DETERMINISTIC AGGREGATION &amp; ORDER PRESERVATION</text>
      <text x="16" y="44" fill="#FFFFFF" class="par-sans" font-size="11">Even if Item #5 finishes before Item #1, Mule maintains original index order:</text>
      <text x="16" y="64" fill="#A6EAF4" class="par-mono" font-size="10">outputPayload = [Result_0, Result_1, Result_2, ... Result_999]</text>
      <text x="16" y="78" fill="#94A3B8" class="par-sans" font-size="9">Target variable scoping: target="vars.parallelResults"</text>
    </g>

    <!-- Error Handling Matrix -->
    <g transform="translate(24, 335)">
      <rect width="481" height="100" rx="8" fill="#0A141F" stroke="rgba(255,255,255,0.08)"/>
      <text x="16" y="24" fill="#EF4444" class="par-sans" font-size="11" font-weight="700">ERROR BOUNDARY BEHAVIOR</text>
      <text x="16" y="44" fill="#94A3B8" class="par-sans" font-size="10">• If 1 item fails: All other running threads COMPLETE their execution.</text>
      <text x="16" y="60" fill="#94A3B8" class="par-sans" font-size="10">• After all threads finish, Mule throws: <tspan fill="#EF4444" class="par-mono">MULE:COMPOSITE_ROUTING</tspan></text>
      <text x="16" y="76" fill="#94A3B8" class="par-sans" font-size="10">• Access individual failure reasons via: <tspan fill="#00F2FE" class="par-mono">error.childErrors['index']</tspan></text>
      <text x="16" y="92" fill="#94A3B8" class="par-sans" font-size="10">• Variables created inside scope do NOT propagate outside the scope.</text>
    </g>
  </g>

  <!-- ==================== FOOTER CALLOUT ==================== -->
  <g transform="translate(48, 608)">
    <text x="0" y="16" fill="#64748B" class="par-sans" font-size="11">⚡ <tspan fill="#ADC6D6" font-weight="600">Enterprise Rule:</tspan> Always configure <tspan fill="#00F2FE" class="par-mono">timeout</tspan> on Scatter-Gather to prevent slow routes from stalling caller threads, and tune <tspan fill="#00F2FE" class="par-mono">maxConcurrency</tspan> to match downstream API rate limits.</text>
    <text x="1104" y="16" fill="#53CADD" class="par-mono" font-size="10" text-anchor="end">MULE 4.6+ ARCHITECTURE</text>
  </g>
</svg>